# Week 10 — Full Stack Deployment
#
# Usage:
#   docker compose up          — start all services
#   docker compose up -d       — start in background
#   docker compose down        — stop all services
#   docker compose logs -f app — follow app logs
#
# Services:
#   - app:    Spring Boot application (port 8080)
#   - qdrant: Vector database (ports 6333/6334)
#   - jaeger: Distributed tracing UI (port 16686)
#   - ollama: (optional) Local LLM inference (port 11434)
#
# Note: The 'app' service requires a Dockerfile.
# If you haven't created one yet, start infrastructure only:
#   docker compose up -d qdrant jaeger
#   ./gradlew :week10:bootRun

services:

  # ── Application ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_GRPC_PORT=6334
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - FAQ_FILE_PATH=/app/data/faq.md
      - TEST_QUESTIONS_PATH=/app/data/test_questions.json
    depends_on:
      qdrant:
        condition: service_healthy
    # TODO: Mount your data directory if FAQ files are local
    # volumes:
    #   - ../data:/app/data:ro

  # ── Vector Database ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API + Dashboard
      - "6334:6334"   # gRPC (used by Spring AI)
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Distributed Tracing ─────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # ── (Optional) Local LLM ───────────────────────────────────────────
  # Uncomment to use Ollama for local inference instead of OpenAI.
  # Requires a GPU or significant CPU resources.
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   # Pull a model after startup:
  #   #   docker compose exec ollama ollama pull llama3.2

volumes:
  qdrant-data:
  # ollama-data:
