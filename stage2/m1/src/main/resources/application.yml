spring:
  application:
    name: stage2-m1-vector-db
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: stage2-m1-faq
        initialize-schema: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
