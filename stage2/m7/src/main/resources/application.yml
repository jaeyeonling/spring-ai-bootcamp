spring:
  application:
    name: stage2-m7-infra

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_GRPC_PORT:6334}
        collection-name: stage2-m7-infra
        initialize-schema: ${QDRANT_INIT_SCHEMA:true}

# ETL 설정
app:
  etl:
    force-reingest: ${ETL_FORCE_REINGEST:false}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# 서버 설정
server:
  port: ${SERVER_PORT:8080}
