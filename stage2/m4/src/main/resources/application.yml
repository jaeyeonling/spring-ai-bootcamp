spring:
  application:
    name: week09-mcp-server
  # MCP STDIO 모드: 배너와 콘솔 로그를 반드시 꺼야 합니다.
  # stdout은 JSON-RPC 전용이어야 하므로 콘솔 패턴을 비우고 로그는 파일로 출력합니다.
  main:
    web-application-type: none
    banner-mode: off
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: week09-faq
        initialize-schema: true
    mcp:
      server:
        name: week09-ai-tools
        version: 1.0.0
        stdio: true

# 콘솔 로그 비활성화 (STDIO MCP 필수) + 파일 로그
logging:
  pattern:
    console:
  file:
    name: /tmp/week09-mcp-server.log

# FAQ 문서 경로
faq:
  file-path: ../data/faq.md
