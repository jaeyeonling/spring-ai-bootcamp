spring:
  application:
    name: week02-evaluation
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
      embedding:
        options:
          model: text-embedding-3-small

# FAQ 문서 경로
faq:
  file-path: ../data/faq.md

# 평가 설정
evaluation:
  test-questions-path: ../data/test_questions.json
  # 컨텍스트로 검색할 상위 청크 수
  top-k: 3
