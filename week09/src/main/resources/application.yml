spring:
  application:
    name: week09-mcp-server
  # MCP STDIO 모드: 배너를 반드시 꺼야 합니다.
  # 로그는 logback.xml에서 파일로만 출력하여 stdout을 JSON-RPC 전용으로 유지합니다.
  main:
    web-application-type: none
    banner-mode: off
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: week09-faq
        initialize-schema: true
    mcp:
      server:
        name: week09-ai-tools
        version: 1.0.0
        stdio: true

# FAQ 문서 경로
faq:
  file-path: ../data/faq.md
