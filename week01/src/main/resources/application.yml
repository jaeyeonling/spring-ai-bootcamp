spring:
  application:
    name: week01-faq-chatbot
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
      embedding:
        options:
          model: text-embedding-3-small

# FAQ 문서 경로
faq:
  file-path: ../data/faq.md
